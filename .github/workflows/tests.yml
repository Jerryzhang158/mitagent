name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-core.txt
      - name: Install core dependencies
        run: python -m pip install -r requirements-core.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Load command-line interface
        run: python main_pipeline.py --help
      - name: Run deterministic tests
        run: python -m unittest -v tests.test_pipeline test_local_pubmed_backend pubmed_year_export.test_parser pubmed_year_export.test_local_index pubmed_year_export.test_baseline_builder
